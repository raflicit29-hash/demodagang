
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrall.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mrall.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.13.0'
}
